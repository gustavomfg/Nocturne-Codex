name: Security · dependencies

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sbom:
    name: Audit production dependencies and generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up the minimum supported Node.js version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > nocturne-codex.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sbom-${{ github.sha }}
          path: nocturne-codex.cdx.json
          if-no-files-found: error
          retention-days: 30
